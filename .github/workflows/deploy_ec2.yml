name: CI/CD - Airflow Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'orchestration/**'
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # FASE 1: CI (Pruebas de Integridad en GitHub)
  # -------------------------------------------------------------
  test-dags:
    name: Test DAGs Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias para pruebas
        run: |
          python -m pip install --upgrade pip
          pip install pytest apache-airflow==2.8.1

      - name: Ejecutar pruebas de integridad con Pytest
        # AQUÍ ESTÁ LA CORRECCIÓN: Apuntando a "test" en singular
        run: |
          pytest orchestration/test/test_dag_integrity.py 

  # -------------------------------------------------------------
  # FASE 2: CD (Despliegue a EC2 solo si las pruebas pasan)
  # -------------------------------------------------------------
  deploy-ec2:
    name: Deploy to EC2
    needs: test-dags
    runs-on: ubuntu-latest

    steps:
      - name: Conectar a EC2 y desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Iniciando despliegue seguro..."
            cd ~/nfl-telemetry-dlt-pipeline-databricks
            git pull origin main
            cd orchestration
            docker compose up -d --build
            echo "¡Despliegue finalizado con éxito!"