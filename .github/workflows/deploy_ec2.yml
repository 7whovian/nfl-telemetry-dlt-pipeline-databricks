name: CI/CD - Airflow Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'orchestration/**'
  workflow_dispatch:

# Permisos estrictamente necesarios para que OIDC funcione con AWS
permissions:
  id-token: write
  contents: read

jobs:
  # -------------------------------------------------------------
  # FASE 1: CI (Pruebas de Integridad e Integración)
  # -------------------------------------------------------------
  test-pipeline:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias para pruebas
        run: |
          python -m pip install --upgrade pip
          pip install pytest apache-airflow==2.8.1
          # Añadimos la instalación de tu requirements por boto3 y confluent_kafka
          pip install -r orchestration/requirements.txt 

      - name: Ejecutar pruebas de DAGs
        run: pytest orchestration/test/test_dag_integrity.py -v

      - name: Autenticación segura con AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::886181573894:role/EC2-Airflow-Kafka-Role
          aws-region: us-east-2

      - name: Ejecutar pruebas de Ingesta (S3 y Kafka)
        env:
          AWS_S3_BUCKET_NAME: "kafka-nfl-telemetry"
          AWS_DEFAULT_REGION: "us-east-2"
          KAFKA_BOOTSTRAP_SERVERS: "pkc-921jm.us-east-2.aws.confluent.cloud:9092"
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          KAFKA_TOPIC_NAME: "nfl_telemetry"
        run: pytest orchestration/test/test_integration_ingestion.py -v

  # -------------------------------------------------------------
  # FASE 2: CD (Despliegue a EC2 solo si TODAS las pruebas pasan)
  # -------------------------------------------------------------
  deploy-ec2:
    name: Deploy to EC2
    needs: test-pipeline # Garantiza que no se despliega si Kafka o S3 fallan
    runs-on: ubuntu-latest

    steps:
      - name: Conectar a EC2 y desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Iniciando despliegue seguro..."
            cd ~/nfl-telemetry-dlt-pipeline-databricks
            git pull origin main
            cd orchestration
            docker compose up -d --build
            echo "¡Despliegue finalizado con éxito!"
