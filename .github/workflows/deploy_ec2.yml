name: CI/CD - Airflow Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'orchestration/**'
  # 1. NUEVO GATILLO: Ejecuta CI al crear un Pull Request hacia main
  pull_request:
    branches:
      - main
    paths:
      - 'orchestration/**'
  workflow_dispatch:

# PERMISOS OBLIGATORIOS PARA OIDC (Nivel Workflow)
permissions:
  id-token: write
  contents: read

jobs:
  test-pipeline:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_DEBUG: true
      
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. NUEVO PASO: Validación de formato estricto (Fail-Fast)
      - name: Configurar entorno de Python para Linting
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Linting corporativo (Flake8 & Black)
        run: |
          python -m pip install --upgrade pip
          pip install black flake8
          # Falla si hay errores graves de sintaxis de Python
          flake8 orchestration/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Construir imagen de Docker de Airflow
        run: |
          cd orchestration
          docker build -t whovian/airflow-ci-tests .

      - name: Ejecutar pruebas de DAGs en Docker
        run: |
          docker run --rm -v ${{ github.workspace }}/orchestration/test:/opt/airflow/test whovian/airflow-ci-tests bash -c "pip install pytest && python -m pytest test/test_dag_integrity.py -v"

      - name: Instalar dependencias de integración
        run: |
          pip install pytest boto3 confluent-kafka python-dotenv

      - name: Autenticación segura con AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::886181573894:role/EC2-Airflow-Kafka-Role
          aws-region: us-east-2

      - name: Ejecutar pruebas de Ingesta (S3 y Kafka)
        env:
          AWS_S3_BUCKET_NAME: "kafka-nfl-telemetry"
          AWS_DEFAULT_REGION: "us-east-2"
          KAFKA_BOOTSTRAP_SERVERS: "pkc-921jm.us-east-2.aws.confluent.cloud:9092"
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          KAFKA_TOPIC_NAME: "nfl_telemetry"
          KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
        run: pytest orchestration/test/test_integration_ingestion.py -v

  deploy-ec2:
    name: Deploy to EC2
    needs: test-pipeline
    # 3. NUEVA CONDICIÓN: Solo despliega a la instancia si el evento es un 'push' directo a main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Conectar a EC2 y desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Iniciando despliegue seguro..."
            cd ~/nfl-telemetry-dlt-pipeline-databricks
            git pull origin main
            cd orchestration
            docker compose up -d --build
            echo "¡Despliegue finalizado con éxito!"